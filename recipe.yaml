package:
  name: igraph
  version: 0.10.16

source:
  path: .
  use_gitignore: true 

build:
  number: 0
  script: | 
    cmake $CMAKE_ARGS \
      -GNinja \
      -DCMAKE_BUILD_TYPE=Release \
      -DCMAKE_INSTALL_PREFIX=$PREFIX \
      -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
      -DBUILD_SHARED_LIBS=OFF \
      -B $SRC_DIR/../build \
      -S .

    cmake --build $SRC_DIR/../build --target install

requirements:
  build: 
    - ${{ compiler('cxx') }}
    - cmake
    - ninja
